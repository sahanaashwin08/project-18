<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 4 Buttons Demo</title>
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="p-4">

  <h2>Button Styles</h2>
  <button type="button" class="btn btn-primary">Primary</button>
  <button type="button" class="btn btn-success">Success</button>
  <button type="button" class="btn btn-danger">Danger</button>
  <button type="button" class="btn btn-warning">Warning</button>
  <button type="button" class="btn btn-info">Info</button>
  <button type="button" class="btn btn-dark">Dark</button>

  <h2 class="mt-4">Outline Buttons</h2>
  <button type="button" class="btn btn-outline-primary">Primary Outline</button>
  <button type="button" class="btn btn-outline-success">Success Outline</button>
  <button type="button" class="btn btn-outline-danger">Danger Outline</button>
  <button type="button" class="btn btn-outline-warning">Warning Outline</button>
  <button type="button" class="btn btn-outline-info">Info Outline</button>
  <button type="button" class="btn btn-outline-dark">Dark Outline</button>

  <h2 class="mt-4">Button Sizes</h2>
  <button type="button" class="btn btn-primary btn-lg">Large Button</button>
  <button type="button" class="btn btn-secondary btn-sm">Small Button</button>

  <h2 class="mt-4">Block Level Buttons</h2>
  <button type="button" class="btn btn-primary btn-block">Block Level Button</button>
  <button type="button" class="btn btn-success btn-block">Another Block Button</button>

  <h2 class="mt-4">Active & Disabled Buttons</h2>
  <button type="button" class="btn btn-primary active">Active Button</button>
  <button type="button" class="btn btn-secondary" disabled>Disabled Button</button>

  <h2 class="mt-4">Spinner Buttons</h2>
  <button class="btn btn-primary" type="button" disabled>
    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    Loading...
  </button>
  <button class="btn btn-success" type="button" disabled>
    <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
    Processing...
  </button>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
